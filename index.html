<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aiden's Math Garage</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Comic Sans MS","Chalkboard SE",Arial,sans-serif;background:linear-gradient(#bfe9ff,#fff6c9);min-height:100vh;text-align:center;overflow-x:hidden}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
#stars{font-size:34px;background:#fff;border-radius:20px;padding:6px 16px;box-shadow:0 4px #f5b800}
#word{background:#fff;border-radius:18px;padding:6px 12px;font-size:20px;cursor:pointer;box-shadow:0 4px #9b7bff;border:none;font-family:inherit}
#mascot{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px}
#pup{font-size:64px;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-8px)}}
#bubble{background:#fff;border-radius:24px;padding:10px 18px;font-size:26px;max-width:70vw;position:relative;box-shadow:0 4px #4aa3ff}
#scene{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;margin:10px}
.grp{background:#fff;border-radius:24px;padding:12px;min-width:120px;max-width:300px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;box-shadow:0 5px #ccc}
.it{font-size:52px;transition:transform .2s}.it.hl{transform:scale(1.5);filter:drop-shadow(0 0 10px gold)}
.plus{font-size:60px;font-weight:bold;color:#ff5b8a}
#nums{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:640px;margin:14px auto;padding:0 10px}
.n{font-size:44px;font-weight:bold;padding:16px 0;border:none;border-radius:22px;color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 6px rgba(0,0,0,.25)}
.n:active{transform:translateY(4px);box-shadow:0 2px rgba(0,0,0,.25)}.n:disabled{opacity:.5}
#ctrl button{font-size:28px;padding:14px 26px;margin:6px;border:none;border-radius:30px;cursor:pointer;font-family:inherit;color:#fff;box-shadow:0 5px rgba(0,0,0,.25)}
#again{background:#2bb673}#mic{background:#ff8c1a}
.conf{position:fixed;top:-60px;font-size:40px;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#big{position:fixed;inset:0;background:rgba(255,255,255,.9);display:none;flex-direction:column;justify-content:center;align-items:center;font-size:48px;z-index:9}
#big button{font-size:32px;padding:16px 30px;border:none;border-radius:30px;background:#4aa3ff;color:#fff;font-family:inherit;margin-top:20px}
#start{position:fixed;inset:0;background:#bfe9ff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10}
#start button{font-size:48px;padding:20px 50px;border:none;border-radius:40px;background:#ff5b8a;color:#fff;font-family:inherit;box-shadow:0 8px #c23;cursor:pointer}
</style></head><body>
<div id="start"><div style="font-size:100px">🐶🚗</div><button id="go">▶ Play!</button></div>
<div id="top"><div id="stars">⭐ 0</div><button id="word" title="Word of the day">🌍</button></div>
<div id="mascot"><div id="pup">🐶</div><div id="bubble">Hi Aiden!</div></div>
<div id="scene"></div>
<div id="nums"></div>
<div id="ctrl"><button id="again">🔊 Say it again</button><button id="mic" style="display:none">🎤 Say answer</button></div>
<div id="big"><div style="font-size:120px">🏆</div><div>10 puzzles! Super star!</div><button id="more">Play more!</button></div>
<script>
const W=["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
const TH=[{e:"🚗",n:"Mustangs"},{e:"🛻",n:"monster trucks"},{e:"🥞",n:"pancakes"},{e:"🥚",n:"eggs"},{e:"🧇",n:"waffles"}];
const COL=["#ff5b8a","#ff8c1a","#f5b800","#2bb673","#1fb5c9","#4aa3ff","#7a5cff","#c04bd6","#e0457b","#3d8b37"];
let a,b,th,stars=0,streak=0,miss=0,level=5,busy=false,lastQ="";
const $=id=>document.getElementById(id);
function voiceFor(lang){const v=speechSynthesis.getVoices();return v.find(x=>x.lang.replace('_','-')==lang)||v.find(x=>x.lang.startsWith(lang.slice(0,2)));}
function say(t,lang="en-US",rate=.8){return new Promise(r=>{if(!window.speechSynthesis){r();return}
 const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=rate;const v=voiceFor(lang);if(v)u.voice=v;
 u.onend=u.onerror=()=>r();setTimeout(r,t.length*150+2500);speechSynthesis.speak(u);});}
function talk(t){$('bubble').textContent=t;speechSynthesis&&speechSynthesis.cancel();return say(t);}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function newQ(){const max=level;let s=2+Math.floor(Math.random()*(max-1));a=1+Math.floor(Math.random()*(s-1));b=s-a;th=TH[Math.floor(Math.random()*TH.length)];
 draw();lastQ=`${W[a]} ${th.n} plus ${W[b]} ${th.n}. How many?`;$('bubble').textContent=`${a} + ${b} = ?`;busy=false;setBtns(true);say(lastQ);}
function draw(){const g=n=>`<div class="grp">${Array.from({length:n},()=>`<span class="it">${th.e}</span>`).join('')}</div>`;
 $('scene').innerHTML=g(a)+'<span class="plus">+</span>'+g(b);}
function setBtns(on){document.querySelectorAll('.n').forEach(x=>x.disabled=!on)}
function confetti(n=30){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='conf';c.textContent=["🎉","⭐","🚗","🥞","🎊","✨"][i%6];
 c.style.left=Math.random()*100+'vw';c.style.animationDuration=(1.5+Math.random()*2)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
async function answer(n){if(busy)return;busy=true;setBtns(false);speechSynthesis.cancel();
 if(n===a+b){stars++;streak++;miss=0;$('stars').textContent=(stars%10===0?'🏆':'⭐')+' '+stars;confetti();
  if(streak>=3&&level<10){level=10}
  await talk(`Yes! ${W[a]} plus ${W[b]} is ${W[a+b]}!`);
  if(stars%10===0){confetti(80);$('big').style.display='flex';say("Wow! Ten puzzles! You are a super star!");return}
  await wait(500);newQ();}
 else{streak=0;miss++;if(miss>=2&&level>5){level=5;miss=0}
  await talk("Good try! Let's count together.");const its=document.querySelectorAll('.it');
  for(let i=0;i<its.length;i++){its[i].classList.add('hl');$('bubble').textContent=i+1;await say(W[i+1]);await wait(250);its[i].classList.remove('hl')}
  await talk(`${W[a]} plus ${W[b]} is ${W[a+b]}. Now you tap it!`);busy=false;setBtns(true);}}
for(let i=1;i<=10;i++){const bt=document.createElement('button');bt.className='n';bt.textContent=i;bt.style.background=COL[i-1];bt.onclick=()=>answer(i);$('nums').appendChild(bt)}
$('again').onclick=()=>{speechSynthesis.cancel();say(lastQ)};
$('more').onclick=()=>{$('big').style.display='none';newQ()};
$('go').onclick=()=>{$('start').remove();talk("Hi Aiden! I'm Bluey! Let's count!").then(newQ)};
// voice answer
const SR=window.webkitSpeechRecognition||window.SpeechRecognition;
if(SR){$('mic').style.display='inline-block';$('mic').onclick=()=>{const r=new SR();r.lang='en-US';r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase();
 let n=parseInt(t);if(isNaN(n))n=W.findIndex(w=>t.includes(w));if(t.includes('to')||t.includes('too'))n=isNaN(n)||n<0?2:n;if(n>0&&n<=10)answer(n)};try{r.start()}catch(e){}}}
// word of the day
const WD=[["Hola","es-ES","Hello in Spanish"],["Bonjour","fr-FR","Hello in French"],["你好","zh-CN","Hello in Chinese"],["Rojo","es-ES","Red in Spanish"],["Bleu","fr-FR","Blue in French"],["三","zh-CN","Three in Chinese"],["Uno","es-ES","One in Spanish"],["Deux","fr-FR","Two in French"],["谢谢","zh-CN","Thank you in Chinese"],["Gracias","es-ES","Thank you in Spanish"]];
const wd=WD[Math.floor(Date.now()/864e5)%WD.length];$('word').textContent='🌍 '+wd[0];
$('word').onclick=async()=>{speechSynthesis.cancel();$('bubble').textContent=wd[0]+' = '+wd[2];await say(wd[2]);await say(wd[0],wd[1],.7);};
speechSynthesis&&speechSynthesis.getVoices();
</script></body></html>
